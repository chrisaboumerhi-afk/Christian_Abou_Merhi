; ESP32 GPS + GSM (SIM800L) tracker
;
;   pio run -e tracker -t upload -t monitor    -> main firmware (src/main.cpp)
;   pio run -e gps_test -t upload -t monitor   -> GPS-only test  (src/tools/gps_test.cpp)
;   pio run -e gsm_test -t upload -t monitor   -> GSM-only test / AT terminal (src/tools/gsm_test.cpp)

[platformio]
default_envs = tracker

; ---------- settings shared by every environment ----------
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------- main tracker firmware ----------
[env:tracker]
build_src_filter = +<main.cpp>
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    vshymanskyy/TinyGSM @ ^0.12.0
    vshymanskyy/StreamDebugger @ ^1.0.1
; Uncomment to echo every AT command/response exchanged with the SIM800L:
; build_flags = -DDUMP_AT_COMMANDS

; ---------- GPS-only test (no SIM800L needed) ----------
[env:gps_test]
build_src_filter = +<tools/gps_test.cpp>
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3

; ---------- GSM-only test: auto diagnostics + interactive AT terminal ----------
[env:gsm_test]
build_src_filter = +<tools/gsm_test.cpp>
; Send a whole line when Enter is pressed and show what you type.
monitor_filters = send_on_enter, esp32_exception_decoder
monitor_eol = CR
monitor_echo = yes
